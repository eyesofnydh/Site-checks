name: Daily Portfolio Tests

on:
  schedule:
    # 04:00 UTC = 09:30 IST every day.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-portfolio-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      BASE_URL: https://nnidhin.netlify.app
    steps:
      - name: Get automation code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile tests
        run: npm test
      - name: Save reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-test-results-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
            results.json
          retention-days: 14
          if-no-files-found: warn
